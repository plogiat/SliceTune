name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - run: node scripts/desktop-smoke.mjs
      - name: Build Windows packages
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath packaging.log
          if ($LASTEXITCODE -ne 0) {
            $detail = (Get-Content packaging.log -Tail 35) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging failed::$detail"
            exit 1
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SliceTune-Windows-x64
          path: |
            release/*.exe
            release/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/*.exe release/*.zip --title "SliceTune $env:GITHUB_REF_NAME — Windows Preview" --notes-file docs/RELEASE_NOTES.md --prerelease
